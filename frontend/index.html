<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-bold" href="index.html">Expense Tracker</a>
      <button class="btn btn-outline-light btn-sm" id="themeToggleBtn" type="button">
        <i class="bi bi-sun-fill" id="themeIcon"></i> <span id="themeText">Light Mode</span>
      </button>
    </div>
  </nav>

  <div class="container my-4">

    <!-- Dynamic Alert Container -->
    <div id="alertContainer"></div>

    <!-- Summary Cards -->
    <div class="summary-cards mb-4">
      <div class="card shadow-sm border-0 bg-primary text-white h-100">
        <div class="card-body">
          <h6 class="card-title text-uppercase">Total Amount</h6>
          <h2 class="card-text fw-bold mb-0" id="totalAmount">$0.00</h2>
        </div>
      </div>

      <div class="card shadow-sm border-0 bg-success text-white h-100">
        <div class="card-body">
          <h6 class="card-title text-uppercase">Number of Expenses</h6>
          <h2 class="card-text fw-bold mb-0" id="expenseCount">0</h2>
        </div>
      </div>

      <div class="card shadow-sm border-0 bg-warning text-dark h-100">
        <div class="card-body">
          <h6 class="card-title text-uppercase">Highest Expense</h6>
          <h2 class="card-text fw-bold mb-0" id="highestExpense">$0.00</h2>
        </div>
      </div>
    </div>

    <!-- Spinner -->
    <div id="spinner" class="my-4" style="display: none;">
      <div class="d-flex justify-content-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </div>

    <!-- Add New Expense & Export Row -->
    <div class="row g-2 mb-4 justify-content-center">
      <div class="col-md-6">
        <button class="btn btn-primary w-100" type="button" data-bs-toggle="modal" data-bs-target="#addModal">
          + Add New Expense
        </button>
      </div>
      <div class="col-md-2">
        <button class="btn btn-success w-100" type="button" id="exportCsvBtn">
          <i class="bi bi-file-earmark-spreadsheet me-1"></i> Export CSV
        </button>
      </div>
    </div>

    <!-- Expenses Table Card -->
    <div class="card shadow-sm border-0">
      <div class="card-body">

        <!-- Search & Filters Header -->
        <div class="row g-3 align-items-center mb-3">
          <div class="col-md-4">
            <h4 class="mb-0">Expenses</h4>
          </div>
          <div class="col-md-8">
            <div class="d-flex flex-wrap align-items-center justify-content-md-end gap-2">

              <!-- Search Title -->
              <input type="text" id="searchInput" class="form-control w-auto" placeholder="Search by title...">

              <!-- Filter Month -->
              <input type="month" id="monthFilter" class="form-control w-auto">

              <!-- Filter Category -->
              <select id="categoryFilter" class="form-select w-auto">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>

              <!-- Reset Filters -->
              <button class="btn btn-outline-secondary btn-sm" id="resetFiltersBtn" title="Reset Filters">
                <i class="bi bi-arrow-counterclockwise"></i> Reset
              </button>
            </div>
          </div>
        </div>

        <!-- Table -->
        <div class="table-responsive mt-3">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th class="sortable-header" data-sort="title">Title <i class="bi bi-arrow-down-up sort-icon"></i></th>
                <th class="sortable-header" data-sort="amount">Amount <i class="bi bi-arrow-down-up sort-icon"></i></th>
                <th class="sortable-header" data-sort="category">Category <i class="bi bi-arrow-down-up sort-icon"></i>
                </th>
                <th class="sortable-header" data-sort="date">Date <i class="bi bi-arrow-down-up sort-icon"></i></th>
                <th class="text-center">Edit</th>
                <th class="text-center">Delete</th>
              </tr>
            </thead>
            <tbody id="expensesTableBody">
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Add Modal -->
    <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addModalLabel">Add New Expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="addExpenseForm" novalidate>
              <div class="mb-3">
                <label for="addTitle" class="form-label">Title *</label>
                <input type="text" class="form-control" id="addTitle" required>
              </div>
              <div class="mb-3">
                <label for="addAmount" class="form-label">Amount ($) *</label>
                <input type="number" step="0.01" class="form-control" id="addAmount" required>
              </div>
              <div class="mb-3">
                <label for="addCategory" class="form-label">Category *</label>
                <select class="form-select" id="addCategory" required>
                  <option value="" disabled selected>Choose category...</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="addDate" class="form-label">Date *</label>
                <input type="date" class="form-control" id="addDate" required>
              </div>
              <div class="text-end">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Expense</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editModalLabel">Edit Expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="editExpenseForm" novalidate>
              <input type="hidden" id="editId">
              <div class="mb-3">
                <label for="editTitle" class="form-label">Title *</label>
                <input type="text" class="form-control" id="editTitle" required>
              </div>
              <div class="mb-3">
                <label for="editAmount" class="form-label">Amount ($) *</label>
                <input type="number" step="0.01" class="form-control" id="editAmount" required>
              </div>
              <div class="mb-3">
                <label for="editCategory" class="form-label">Category *</label>
                <select class="form-select" id="editCategory" required>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="editDate" class="form-label">Date *</label>
                <input type="date" class="form-control" id="editDate" required>
              </div>
              <div class="text-end">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Changes</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
